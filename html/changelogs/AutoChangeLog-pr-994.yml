author: "buffyuwu"
delete-after: True
changes:
  - qol: "bloody footprints no longer create bloody footprints. only blood pools do now"
  - qol: "npcs will now path away from blood pools. because normal people dont go near corpses/blood"
  - refactor: "blood pools now expire overtime, and slowly fade over the course of 10 minutes rather than lasting forever. This is to avoid the city looking like a blood bath because a janitor isnt on, while still giving the janitor plenty of time to find and clean the blood"
  - refactor: "blood now 'dries' by changing to the dark sprite in 1 minute instead of 15 seconds, giving players a better understanding if blood is actually fresh or not"
  - qol: "you will only do damage or get bloody if you are attacking people in combat mode. meaning you can now annoy your friends by spamming them with plushies!"
  - refactor: "refined sabbat shovelheads. now sabbat players can embrace any npc to create shovelheads"
  - bugfix: "shovelheads now have combat stats"
  - bugfix: "shovelheads will no longer jump at walls forever or track players through walls"